<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>데이터베이스 테스트</title>
    <style>
        table, th, td {
            border: 1px solid black;
            border-collapse: collapse;
            text-align: center;
        }
        th, td {
            padding: 4px 10px;
        }
    </style>
</head>
<body>
    <h1>User List</h1>
    <table>
        <thead>
            <tr>
                <th>아이디</th>
                <th>이름</th>
                <th>나이</th>
                <th>성별</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="user : ${data4}">
                <td th:text="${user.id}">1</td>
                <td th:text="${user.name}">홍길동</td>
                <td th:text="${user.age}">25</td>
                <td th:text="${user.gender}">남</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
